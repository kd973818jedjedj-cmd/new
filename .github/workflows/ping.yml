name: gemini-ping

on:
  schedule:
    - cron: "0 */6 * * *"      # every 6 hours (UTC). Edit to taste.
  workflow_dispatch:            # manual run button in the Actions tab

permissions:
  contents: write               # lets the bot commit its state files
  actions: write                # lets the bot delete old workflow runs

concurrency:
  group: gemini-ping
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import os, re, json, random, time, datetime as dt
          import urllib.request, urllib.error
          import xml.etree.ElementTree as ET
          from urllib.parse import urlparse

          KEY = os.environ["GEMINI_API_KEY"]
          HOOK = os.environ["DISCORD_WEBHOOK_URL"]
          PINNED = os.environ.get("GEMINI_MODEL", "")      # optional: force one model first
          SEEN_FILE, SEEN_MAX = "seen.json", 60
          HEALTH_FILE = "model_health.json"
          DEADLINE = time.monotonic() + 9 * 60             # hard time budget for the whole run
          # Google-maintained aliases that always point at a current model
          FALLBACK_MODELS = ["gemini-flash-latest", "gemini-flash-lite-latest"]
          MAX_TRIES = 10
          # If one grounding tool format is rejected, the bot heals itself by trying the other.
          TOOL_VARIANTS = [{"google_search": {}}, {"google_search_retrieval": {}}]

          HACK_TOPICS = [
              "the biggest cyberattacks and data breaches hitting famous corporations, governments or critical infrastructure",
              "major ransomware attacks causing large disruption at companies, hospitals or governments",
              "critical zero-day vulnerabilities being actively exploited and affecting millions of devices",
              "major software supply-chain attacks (npm, PyPI, poisoned updates)",
          ]
          BREAKING_TOPICS = [
              "major shake-ups at top tech companies: CEO changes, top executives leaving, mass layoffs, giant acquisitions",
              "major lawsuits, fines and antitrust investigations targeting big tech",
              "major turning points in AI: shocking new models, billion-dollar deals, legal fights",
          ]
          TECH_TOPICS = [
              "AI and large language models",
              "hardware, chips and GPUs",
              "open source and developer tools",
          ]


          FEEDS = {
              "hack": [
                  ("BleepingComputer", "https://www.bleepingcomputer.com/feed/"),
                  ("The Hacker News", "https://feeds.feedburner.com/TheHackersNews"),
                  ("Krebs on Security", "https://krebsonsecurity.com/feed/"),
                  ("SecurityWeek", "https://www.securityweek.com/feed/"),
                  ("The Record", "https://therecord.media/feed"),
              ],
              "news": [
                  ("TechCrunch", "https://techcrunch.com/feed/"),
                  ("The Verge", "https://www.theverge.com/rss/index.xml"),
                  ("Ars Technica", "https://feeds.arstechnica.com/arstechnica/index"),
                  ("Wired", "https://www.wired.com/feed/rss"),
                  ("Hacker News", "https://hnrss.org/frontpage?points=300"),
              ],
          }


          def pick_topic():
              r = random.random()
              if r < 0.55:
                  return random.choice(HACK_TOPICS), "hack"
              if r < 0.85:
                  return random.choice(BREAKING_TOPICS), "breaking"
              return random.choice(TECH_TOPICS), "tech"


          # ---------------------------------------------------------------- http
          class ApiError(Exception):
              """code: HTTP status, 0 = network, -1 = empty answer, -2 = failed format check.
              scope (429 only): 'day', 'minute' or 'zero' (no quota at all); retry: seconds to wait."""
              def __init__(self, code, msg, scope=None, retry=None):
                  super().__init__(msg)
                  self.code, self.scope, self.retry = code, scope, retry


          def explain(e):
              """Compact, secret-free summary of a Google API error (which quota was hit)."""
              try:
                  err = json.load(e).get("error", {})
              except Exception:
                  return "", None, None
              scope = retry = None
              parts = []
              for d in err.get("details", []):
                  t = str(d.get("@type", ""))
                  if t.endswith("QuotaFailure"):
                      for v in d.get("violations", [])[:1]:
                          qid = str(v.get("quotaId", ""))
                          val = str(v.get("quotaValue", ""))
                          parts.append(f"quota {qid or v.get('quotaMetric', '?')} limit={val or '?'}")
                          if val == "0":
                              scope = "zero"
                          elif "PerDay" in qid:
                              scope = "day"
                          elif "PerMinute" in qid:
                              scope = "minute"
                  elif t.endswith("RetryInfo"):
                      m = re.match(r"([\d.]+)s", str(d.get("retryDelay", "")))
                      if m:
                          retry = float(m.group(1))
              if parts:
                  return " ".join(parts) + (f" retry={retry:.0f}s" if retry else ""), scope, retry
              return str(err.get("message", ""))[:150], scope, retry


          def post_json(url, body, headers=None, timeout=60, retries=3,
                        retry_on=(500, 502, 503, 504), show_msg=False):
              data = json.dumps(body).encode()
              h = {"Content-Type": "application/json", "User-Agent": "gemini-discord-bot"}
              h.update(headers or {})
              host = urlparse(url).netloc          # log the hostname only, never the full URL
              for i in range(retries):
                  try:
                      req = urllib.request.Request(url, data=data, headers=h)
                      with urllib.request.urlopen(req, timeout=timeout) as r:
                          raw = r.read()
                          return json.loads(raw) if raw else {}
                  except urllib.error.HTTPError as e:
                      msg, scope, retry = "", None, None
                      if show_msg:                  # Google's error details help self-diagnosis
                          msg, scope, retry = explain(e)
                      if e.code in retry_on and i < retries - 1:
                          wait = 5 * 2 ** i
                          ra = e.headers.get("Retry-After") if e.headers else None
                          if ra and ra.isdigit():
                              wait = min(int(ra), 30)
                          time.sleep(wait)
                          continue
                      raise ApiError(e.code, f"HTTP {e.code} from {host}" + (f": {msg}" if msg else ""),
                                     scope, retry) from None
                  except (urllib.error.URLError, TimeoutError, OSError):
                      if i < retries - 1:
                          time.sleep(5 * 2 ** i)
                          continue
                      raise ApiError(0, f"Cannot reach {host}") from None
                  except ValueError:
                      raise ApiError(0, f"Bad JSON from {host}") from None


          # ---------------------------------------------------------------- state
          def load_json(path, default):
              try:
                  with open(path, encoding="utf-8") as f:
                      v = json.load(f)
                  return v if isinstance(v, type(default)) else default
              except (FileNotFoundError, json.JSONDecodeError):
                  return default


          def save_json(path, obj):
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(obj, f, ensure_ascii=False, indent=1)


          health = load_json(HEALTH_FILE, {})   # model -> {fails, until, ok, last_error}


          def cooling(name):
              return health.get(name, {}).get("until", 0) > time.time()


          def mark_ok(name):
              health[name] = {"fails": 0, "until": 0, "ok": int(time.time()), "last_error": ""}


          def mark_fail(name, err):
              fails = min(health.get(name, {}).get("fails", 0) + 1, 10)
              if err.code == 429:
                  # zero = this key has no quota for the model, day = used up for today
                  hours = {"zero": 48, "day": 6}.get(err.scope, 0.25 if err.scope == "minute" else 1)
              elif err.code in (403, 404):
                  hours = 48                         # model not available to this key
              elif err.code in (400, -1, -2):
                  hours = min(2 ** fails, 48)        # broken for us: back off, then retest
              else:
                  hours = 0.25                       # 5xx / network: probably transient
              health[name] = {"fails": fails, "until": int(time.time() + hours * 3600),
                              "ok": health.get(name, {}).get("ok", 0), "last_error": str(err)[:120]}


          # ---------------------------------------------------------------- gemini
          def pick_models():
              """Ask Google which models exist right now. Order: newest flash, then newest
              flash-lite, then newest pro, then a hardcoded safety net."""
              found = []
              try:
                  req = urllib.request.Request(
                      "https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000",
                      headers={"x-goog-api-key": KEY, "User-Agent": "gemini-discord-bot"},
                  )
                  with urllib.request.urlopen(req, timeout=30) as r:
                      listing = json.load(r)
                  tier = {"flash": 0, "flash-lite": 1, "pro": 2}
                  for m in listing.get("models", []):
                      name = m.get("name", "").removeprefix("models/")
                      if "generateContent" not in m.get("supportedGenerationMethods", []):
                          continue
                      mt = re.fullmatch(r"gemini-(\d+(?:\.\d+)?)-(flash-lite|flash|pro)", name)
                      if not mt or float(mt.group(1)) < 2.0:      # need Google Search grounding
                          continue
                      found.append((tier[mt.group(2)], -float(mt.group(1)), name))
              except Exception:
                  pass                                            # listing failed: use safety net
              found.sort()
              by_tier = {0: [], 1: [], 2: []}
              for t, _, n in found:
                  by_tier[t].append(n)
              # newest flash first, but keep older flash, lite, hardcoded and pro models in reach
              ordered = (([PINNED] if PINNED else []) + by_tier[0][:3] + by_tier[1][:2]
                         + by_tier[0][3:5] + FALLBACK_MODELS + by_tier[2][:1])
              return list(dict.fromkeys(ordered))[:MAX_TRIES]


          def valid(text):
              """Self-test of the model output before we trust it."""
              t = text.strip()
              if t.upper().startswith("NO_SIGNAL"):
                  return True
              return len(t) > 120 and re.search(r"\*\*\[\d+\]", t) is not None


          def attempt(model, body, variants):
              """Like _attempt, but if Google says 'slow down for N seconds', wait once and retry."""
              try:
                  return _attempt(model, body, variants)
              except ApiError as e:
                  if (e.code == 429 and e.scope not in ("day", "zero") and e.retry and e.retry <= 45
                          and time.monotonic() + e.retry + 90 < DEADLINE):
                      time.sleep(e.retry + 1)
                      return _attempt(model, body, variants)
                  raise


          def _attempt(model, body, variants):
              """One real call = one live test of this model. Raises ApiError on any problem."""
              url = f"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent"
              last = None
              for tool in variants:                      # None = plain call without any tool
                  try:
                      data = post_json(url, dict(body, tools=[tool]) if tool else body,
                                       headers={"x-goog-api-key": KEY}, timeout=75,
                                       retries=2, show_msg=True)
                  except ApiError as e:
                      if e.code == 400 and re.search(r"tool|search|ground", str(e), re.I):
                          last = e                                # heal: try the other tool format
                          continue
                      raise
                  cands = data.get("candidates") or []
                  parts = cands[0].get("content", {}).get("parts", []) if cands else []
                  text = "".join(p.get("text", "") for p in parts).strip()
                  if not text:
                      raise ApiError(-1, "empty response")
                  if not valid(text):
                      raise ApiError(-2, "output failed format check")
                  return text, cands[0]
              raise last or ApiError(-1, "no request variant worked")


          def run_rounds(body, variants, suffix, errors):
              """Try models in rounds until one passes its live test -> (text, cand, model) or None.
              Round 0: healthy models only. Later rounds: never lazy, retry everything that could
              still work. Models with no quota left today (or no access) are not hammered again."""
              dead = set()
              for rnd in range(3):
                  todo = [m for m in pick_models() if m not in dead and (rnd > 0 or not cooling(m + suffix))]
                  if not todo:
                      if rnd == 0:
                          continue
                      break
                  if rnd:
                      time.sleep(20 * rnd)
                  for m in todo:
                      if time.monotonic() > DEADLINE:
                          return None
                      try:
                          text, cand = attempt(m, body, variants)
                      except ApiError as e:
                          mark_fail(m + suffix, e)
                          errors[m + suffix] = str(e)
                          if e.code in (403, 404, 429):      # 429 already got its one polite retry
                              dead.add(m)
                          continue
                      mark_ok(m + suffix)
                      return text, cand, m
              return None


          def fetch_feeds(kind):
              """Plan B news source: real headlines from RSS/Atom feeds (no Gemini quota needed)."""
              items = []
              for outlet, url in FEEDS["hack" if kind == "hack" else "news"]:
                  if time.monotonic() > DEADLINE:
                      break
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (compatible; gemini-discord-bot)"})
                      with urllib.request.urlopen(req, timeout=15) as r:
                          root = ET.fromstring(r.read())
                  except Exception:
                      continue
                  atom = "{http://www.w3.org/2005/Atom}"
                  n = 0
                  for it in list(root.iter("item")) + list(root.iter(atom + "entry")):
                      title = (it.findtext("title") or it.findtext(atom + "title") or "").strip()
                      link = (it.findtext("link") or "").strip()
                      if not link:
                          a = it.find(atom + "link")
                          link = a.get("href", "") if a is not None else ""
                      date = (it.findtext("pubDate") or it.findtext(atom + "updated") or "").strip()
                      desc = it.findtext("description") or it.findtext(atom + "summary") or ""
                      desc = re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", desc)).strip()[:160]
                      if title and link.startswith("http"):
                          items.append({"outlet": outlet, "title": title, "link": link, "date": date, "desc": desc})
                          n += 1
                          if n >= 12:
                              break
              return items[:70]


          def finish_feed_text(text, items):
              """Turn 'Source: <url>' lines into clean source links; drop any link not in the feeds."""
              by_link = {it["link"]: it["outlet"] for it in items}
              sources, used = [], set()
              for u in re.findall(r"https?://[^\s)\]>*]+", text):
                  u = u.rstrip(".,;")
                  if u in by_link and by_link[u] not in used:
                      used.add(by_link[u])
                      sources.append(f"[{by_link[u]}]({u})")
              text = re.sub(r"(?m)^[ \t]*-?[ \t]*\**Source\**:.*\n?", "", text)
              text = re.sub(r"https?://\S+", "", text)           # stray (maybe invented) links
              return text.strip(), sources[:5]


          def summarize(errors, n_items):
              groups = {}
              for k, v in errors.items():
                  v = re.sub(r"HTTP (\d+) from [\w.]+:? ?", r"HTTP \1 ", v)
                  groups.setdefault(v[:120], []).append(k)
              out = " | ".join(f"{len(ks)}x {msg} (e.g. {ks[0]})" for msg, ks in groups.items())
              plain429 = any(k.endswith("|feeds") and "429" in v for k, v in errors.items())
              if plain429:
                  out += (" || HINT: 429 even WITHOUT Google Search means this API key/project has no usable "
                          "quota: enable billing in AI Studio or create a key in a new project.")
              elif n_items == 0:
                  out += " || NOTE: news feeds were unreachable too."
              return out


          def ask_gemini(topic, kind, seen):
              today = dt.datetime.now(dt.timezone.utc).strftime("%Y-%m-%d")
              avoid = ""
              if seen:
                  avoid = ("\nALREADY POSTED, DO NOT REPEAT THESE STORIES:\n- "
                           + "\n- ".join(seen[-30:]) + "\n")
              style = (
                  "OUTPUT LANGUAGE: write in English, in the voice of a cool cyber-intelligence news channel, "
                  "but stay factually accurate. Use exactly this format for each story:\n"
                  "**[number] Victim or event name**\n"
                  "- Severity: \U0001F534 CRITICAL or \U0001F7E0 HIGH or \U0001F7E1 NOTABLE\n"
                  "- What happened: 1-2 sentences with scale (people, money, records, downtime) if known.\n"
                  "- How it happened: 1-2 sentences, only at the level the sources have publicly reported. "
                  "No exploit code, payloads or reproduction steps. If unknown, say it is under investigation. "
                  "For non-hack stories, replace this line with 'Context'.\n"
                  "- Impact: 1 sentence on the consequence or the lesson.\n"
              )
              big = (
                  "SIGNIFICANCE FILTER: only pick stories that are truly big, meeting at least one of: "
                  "(a) involves a very famous company or organization, "
                  "(b) affects millions of people or causes huge damage, "
                  "(c) is making waves, covered by many major outlets at once. "
                  "Skip minor stories. Return at most 3 stories, biggest first. Fewer than 3 is fine, "
                  "never pad the list. If NOTHING qualifies, reply with exactly one word: NO_SIGNAL\n\n"
              )
              errors = {}

              # Mode 1: Gemini searches the web itself (Google Search grounding).
              prompt = (
                  f"Today is {today}. Search the web for the MOST RECENT news (last few days) about: {topic}.\n\n"
                  + big +
                  "ANTI-HALLUCINATION: every story must be confirmed by at least 2 reputable outlets. "
                  "If something is only a rumor or unconfirmed, label it 'UNCONFIRMED' or skip it. "
                  "Never speculate and never add details the sources do not state.\n\n"
                  + style + "\nNo greeting and no closing remarks." + avoid
              )
              res = run_rounds({"contents": [{"parts": [{"text": prompt}]}]}, TOOL_VARIANTS, "", errors)
              if res:
                  text, cand, m = res
                  sources, names = [], set()
                  for c in cand.get("groundingMetadata", {}).get("groundingChunks", []):
                      web = c.get("web")
                      if not web or not web.get("uri"):
                          continue
                      name = web.get("title") or urlparse(web["uri"]).netloc
                      if name in names:
                          continue
                      names.add(name)
                      sources.append(f"[{name}]({web['uri']})")
                  return text, sources[:5], re.findall(r"\*\*\[\d+\]\s*(.+?)\*\*", text), m

              # Mode 2: we fetch real headlines from RSS feeds, Gemini only picks and writes.
              # Needs no search grounding, so it works when the search quota is the problem.
              items = fetch_feeds(kind)
              if items:
                  lines = "\n".join(f"- {i['outlet']} | {i['date']} | {i['title']} | {i['desc']} | {i['link']}"
                                    for i in items)
                  prompt = (
                      f"Today is {today}. Below are the latest headlines fetched from news feeds, one per line "
                      f"as: outlet | date | title | summary | url.\n\n{lines}\n\n"
                      f"Topic: {topic}.\n\n" + big +
                      "USE ONLY THE LISTED HEADLINES. Never add facts that are not in the list. Prefer stories "
                      "that several outlets in the list report. If a story is not confirmed by the headline text, "
                      "say so.\n\n" + style +
                      "- Source: copy ONE url exactly as given in the list.\n\n"
                      "No greeting and no closing remarks." + avoid
                  )
                  res = run_rounds({"contents": [{"parts": [{"text": prompt}]}]}, [None], "|feeds", errors)
                  if res:
                      text, cand, m = res
                      text, sources = finish_feed_text(text, items)
                      return text, sources, re.findall(r"\*\*\[\d+\]\s*(.+?)\*\*", text), m + " + feeds"
              raise RuntimeError(summarize(errors, len(items)))


          # ---------------------------------------------------------------- discord
          def trim(text, limit):
              if len(text) <= limit:
                  return text
              cut = text[:limit]
              k = cut.rfind("\n\n")
              return (cut[:k] if k > 200 else cut).rstrip() + "\n..."


          def send_discord(topic, kind, text, sources, model):
              now = dt.datetime.now(dt.timezone.utc)
              trace = "".join(random.choice("0123456789abcdef") for _ in range(10))
              if kind == "hack":
                  banner, color, tag = "\u001b[1;31m[!] BREACH ALERT\u001b[0m", 0xFF0033, "BREACH"
              elif kind == "breaking":
                  banner, color, tag = "\u001b[1;33m[!] BREAKING // CLASSIFIED\u001b[0m", 0xFFA500, "BREAKING"
              else:
                  banner, color, tag = "\u001b[1;32m[+] INTERCEPTING FEED\u001b[0m", 0x00FF41, "TECH"
              header = (
                  "```ansi\n"
                  f"{banner}  id:{trace}\n"
                  f"\u001b[0;36m[>] channel:\u001b[0m {topic[:70]}\n"
                  f"\u001b[0;36m[>] time   :\u001b[0m {now.strftime('%Y-%m-%d %H:%M UTC')}\n"
                  "```"
              )
              tail = ("\n\n**Sources:** " + " \u00b7 ".join(sources)) if sources else ""
              desc = trim(text, 4000 - len(tail)) + tail
              payload = {
                  "username": "ghost_in_the_shell",
                  "content": header,
                  "allowed_mentions": {"parse": []},   # block @everyone/@here from AI text
                  "embeds": [{
                      "description": desc,
                      "color": color,
                      "timestamp": now.isoformat(),
                      "footer": {"text": f"{tag} // via {model} // no humans involved"},
                  }],
              }
              post_json(HOOK, payload, timeout=30, retries=4, retry_on=(429, 500, 502, 503, 504))


          def send_error(msg):
              run = ""
              if os.environ.get("GITHUB_RUN_ID"):
                  run = (f"\n{os.environ.get('GITHUB_SERVER_URL', 'https://github.com')}/"
                         f"{os.environ.get('GITHUB_REPOSITORY', '')}/actions/runs/{os.environ['GITHUB_RUN_ID']}")
              try:
                  post_json(HOOK, {
                      "username": "ghost_in_the_shell",
                      "content": f"```ansi\n\u001b[1;33m[x] SIGNAL LOST\u001b[0m  {msg[:700]}\n```{run}",
                      "allowed_mentions": {"parse": []},
                  }, timeout=30, retries=2, retry_on=(429, 500, 502, 503, 504))
              except Exception:
                  pass


          def main():
              seen = load_json(SEEN_FILE, [])
              topic, kind = pick_topic()
              try:
                  text, sources, titles, model = ask_gemini(topic, kind, seen)
              finally:
                  save_json(HEALTH_FILE, health)       # remember what worked, even after a failure
              if text.strip().upper().startswith("NO_SIGNAL"):
                  print(f"No story big enough (model {model}), skipping this run.")
                  return
              send_discord(topic, kind, text, sources, model)
              save_json(SEEN_FILE, (seen + titles)[-SEEN_MAX:])


          if __name__ == "__main__":
              try:
                  main()
              except Exception as e:
                  send_error(str(e))
                  raise
          PY

      - name: Auto commit state (seen.json, model_health.json)
        if: always()                # save what the bot learned even when the run failed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: update bot state [skip ci]"
          git pull --rebase
          git push

      - name: Delete old workflow runs (keep newest 10)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.id != ${{ github.run_id }}) | .id' \
            | tail -n +11 \
            | xargs -r -I{} gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/{}" \
            || true
